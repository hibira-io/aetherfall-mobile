# A release tag builds both store apps, mirroring hibira-io/hibira-app's
# release.yml with pixel-realm's tag scheme (see .github/scripts/app-version.sh):
#   v1.2.3-dev.N → DEV server   → TestFlight + Play internal testing (draft)
#   v1.2.3-rc.N  → UAT server   → TestFlight + Play closed testing (draft)
#   v1.2.3       → PRD server   → TestFlight + Play production (draft); the
#                  PRD environment's required reviewer approves the run.
# Nothing is submitted for App Store review or rolled out on Play by this
# workflow: a person does that in App Store Connect / Play Console.
#
# Secrets and variables (org-level ones shared with hibira-app work too):
#   iPhone   APPLE_TEAM_ID (org variable), ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8
#   Android  ANDROID_UPLOAD_KEYSTORE (base64 of the .jks),
#            ANDROID_UPLOAD_PASSWORD,
#            PLAY_SERVICE_ACCOUNT_JSON (optional: upload to Play)
#            APK_BUCKET, APK_PUBLISH_ROLE_ARN (GitHub environment variables,
#            optional): publish the signed test APK to the landing page's
#            downloads bucket (pixel-realm infra/downloads.tf and
#            docs/operations/android-apk.md). Without them the APK is only a
#            run artifact.
#   Game     HIBIRA_CI_APP_CLIENT_ID (org variable), HIBIRA_CI_APP_PRIVATE_KEY (org
#            secret): the Hibira CI GitHub App, installed on pixel-realm
name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.version.outputs.name }}
      code: ${{ steps.version.outputs.code }}
      env: ${{ steps.version.outputs.env }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - id: version
        run: .github/scripts/app-version.sh

  web:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with: { node-version: 22 }
      - name: pixel-realm ref
        id: pr
        env:
          OVERRIDE: ''
          CLIENT_ID: ${{ vars.HIBIRA_CI_APP_CLIENT_ID }}
          KEY: ${{ secrets.HIBIRA_CI_APP_PRIVATE_KEY }}
        run: |
          [ -n "$CLIENT_ID" ] && [ -n "$KEY" ] || { echo "::error::Missing variable HIBIRA_CI_APP_CLIENT_ID or secret HIBIRA_CI_APP_PRIVATE_KEY (the Hibira CI GitHub App): see README"; exit 1; }
          echo "ref=${OVERRIDE:-$(tr -d '[:space:]' < pixel-realm.ref)}" >> "$GITHUB_OUTPUT"
      # A one-hour token that can only read pixel-realm (pixel-realm is private).
      - id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.HIBIRA_CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.HIBIRA_CI_APP_PRIVATE_KEY }}
          owner: hibira-io
          repositories: pixel-realm
          permission-contents: read
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: hibira-io/pixel-realm
          ref: ${{ steps.pr.outputs.ref }}
          path: .cache/pixel-realm
          token: ${{ steps.app.outputs.token }}
          persist-credentials: false
      - run: scripts/build-web.sh
        env:
          AETHERFALL_ENV: ${{ needs.version.outputs.env }}
          PIXEL_REALM_DIR: .cache/pixel-realm
          PIXEL_REALM_REF: ${{ steps.pr.outputs.ref }}
      - run: cat www/build-info.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with: { name: www, path: www, retention-days: 30 }

  ios:
    needs: [version, web]
    runs-on: macos-26
    environment: ${{ needs.version.outputs.env == 'prd' && 'PRD' || needs.version.outputs.env == 'uat' && 'UAT' || 'DEV' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with: { name: www, path: www }

      - name: App Store Connect key
        env:
          TEAM: ${{ vars.APPLE_TEAM_ID || secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER: ${{ secrets.ASC_ISSUER_ID }}
          P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          set -euo pipefail
          for n in TEAM KEY_ID ISSUER P8; do
            [ -n "${!n}" ] || { echo "::error::Missing APPLE_TEAM_ID (org variable) or secret (ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8): see README"; exit 1; }
          done
          [[ "$TEAM" =~ ^[A-Z0-9]{10}$ ]] || { echo "::error::APPLE_TEAM_ID is 10 letters and digits"; exit 1; }
          printf '%s\n' "$P8" > "$RUNNER_TEMP/AuthKey.p8"
          plutil -create xml1 "$RUNNER_TEMP/export.plist"
          plutil -insert method -string app-store-connect "$RUNNER_TEMP/export.plist"
          plutil -insert destination -string upload "$RUNNER_TEMP/export.plist"
          plutil -insert signingStyle -string automatic "$RUNNER_TEMP/export.plist"
          plutil -insert teamID -string "$TEAM" "$RUNNER_TEMP/export.plist"
          plutil -insert manageAppVersionAndBuildNumber -bool NO "$RUNNER_TEMP/export.plist"
          {
            echo "TEAM=$TEAM"
            echo "AUTH=-allowProvisioningUpdates -authenticationKeyPath $RUNNER_TEMP/AuthKey.p8 -authenticationKeyID $KEY_ID -authenticationKeyIssuerID $ISSUER"
          } >> "$GITHUB_ENV"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with: { node-version: 22, cache: npm }
      - run: npm ci && npx cap sync ios

      - name: Archive
        env:
          CODE: ${{ needs.version.outputs.code }}
          NAME: ${{ needs.version.outputs.name }}
        run: |
          set -euo pipefail
          # $AUTH is several arguments on purpose.
          # shellcheck disable=SC2086
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination "generic/platform=iOS" -archivePath "$RUNNER_TEMP/Aetherfall.xcarchive" \
            $AUTH DEVELOPMENT_TEAM="$TEAM" CODE_SIGN_STYLE=Automatic \
            MARKETING_VERSION="$NAME" CURRENT_PROJECT_VERSION="$CODE" archive

      - name: Upload to TestFlight
        run: |
          set -euo pipefail
          # shellcheck disable=SC2086
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Aetherfall.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist" -exportPath "$RUNNER_TEMP/export" $AUTH
          echo "### 星核崩落 iPhone ${{ needs.version.outputs.name }} (build ${{ needs.version.outputs.code }}, ${{ needs.version.outputs.env }} server) sent to TestFlight" >> "$GITHUB_STEP_SUMMARY"

      - name: Revoke this runner's development certificate
        if: always()
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: node .github/scripts/asc-revoke-runner-cert.mjs

      - name: Clean up the key
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"

  android:
    needs: [version, web]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC: publish the test APK (APK_PUBLISH_ROLE_ARN)
    environment: ${{ needs.version.outputs.env == 'prd' && 'PRD' || needs.version.outputs.env == 'uat' && 'UAT' || 'DEV' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with: { name: www, path: www }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with: { distribution: temurin, java-version: "21", cache: gradle }
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with: { packages: "platforms;android-36 build-tools;36.0.0" }

      - name: Keys
        env:
          KEYSTORE: ${{ secrets.ANDROID_UPLOAD_KEYSTORE }}
          PASS: ${{ secrets.ANDROID_UPLOAD_PASSWORD }}
        run: |
          set -euo pipefail
          [ -n "$KEYSTORE" ] && [ -n "$PASS" ] || { echo "::error::Missing secret ANDROID_UPLOAD_KEYSTORE / ANDROID_UPLOAD_PASSWORD: see README"; exit 1; }
          printf %s "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/upload.jks"
          alias=$(keytool -list -keystore "$RUNNER_TEMP/upload.jks" -storepass "$PASS" | sed -n 's/^\([^,]*\),.*PrivateKeyEntry.*/\1/p' | head -1)
          sha=$(keytool -list -v -keystore "$RUNNER_TEMP/upload.jks" -alias "$alias" -storepass "$PASS" | sed -n 's/.*SHA256: //p')
          echo "KEY_ALIAS=$alias" >> "$GITHUB_ENV"
          echo "Upload key SHA-256 (for the App Links file pixel-realm will serve): \`$sha\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Build the bundle and the APK
        env:
          PASS: ${{ secrets.ANDROID_UPLOAD_PASSWORD }}
          CODE: ${{ needs.version.outputs.code }}
          NAME: ${{ needs.version.outputs.name }}
        run: |
          set -euo pipefail
          npm ci && npx cap sync android
          cd android && chmod +x gradlew
          # The bundle goes to Play; the APK (same build, same upload key) is
          # the test build players install from the landing page.
          ./gradlew --no-daemon bundleRelease assembleRelease \
            -PversionCode="$CODE" -PversionName="$NAME" \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/upload.jks" \
            -Pandroid.injected.signing.store.password="$PASS" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$PASS"

      - name: Test APK and its manifest
        id: apk
        env:
          TAG: ${{ github.ref_name }}
          CODE: ${{ needs.version.outputs.code }}
          NAME: ${{ needs.version.outputs.name }}
          CHANNEL: ${{ needs.version.outputs.env }}
        run: .github/scripts/apk-manifest.sh android/app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/apk"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: aetherfall-android-${{ needs.version.outputs.name }}-${{ needs.version.outputs.code }}
          path: |
            android/app/build/outputs/bundle/release/app-release.aab
            ${{ runner.temp }}/apk/
          retention-days: 30

      # The landing page's download (pixel-realm game-server/internal/downloads).
      # The role only trusts this repo's matching GitHub environment and may
      # only write android/* in that environment's bucket.
      - name: Check the downloads bucket settings
        id: publish
        env:
          BUCKET: ${{ vars.APK_BUCKET }}
          ROLE: ${{ vars.APK_PUBLISH_ROLE_ARN }}
        run: |
          if [ -n "$BUCKET" ] && [ -n "$ROLE" ]; then echo "on=true" >> "$GITHUB_OUTPUT"
          else echo "::warning::APK_BUCKET / APK_PUBLISH_ROLE_ARN not set for this environment: the APK stays a run artifact and the landing page is not updated"; fi
      - if: steps.publish.outputs.on == 'true'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: ${{ vars.APK_PUBLISH_ROLE_ARN }}
          aws-region: ap-northeast-1
      - name: Publish the APK to the landing page
        if: steps.publish.outputs.on == 'true'
        env:
          BUCKET: ${{ vars.APK_BUCKET }}
          FILE: ${{ steps.apk.outputs.file }}
        run: |
          set -euo pipefail
          # The APK first, then the manifest that points at it, so the page
          # never links to a file that isn't there yet.
          aws s3 cp "$RUNNER_TEMP/apk/$(basename "$FILE")" "s3://$BUCKET/$FILE" \
            --content-type application/vnd.android.package-archive --no-progress
          aws s3 cp "$RUNNER_TEMP/apk/latest.json" "s3://$BUCKET/android/latest.json" \
            --content-type application/json --cache-control no-cache --no-progress
          echo "Published \`$FILE\` to the landing page (s3://$BUCKET)." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload to Play
        env:
          PLAY: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        if: env.PLAY != ''
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: io.hibira.aetherfall
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          track: ${{ needs.version.outputs.env == 'prd' && 'production' || needs.version.outputs.env == 'uat' && 'alpha' || 'internal' }}
          status: draft

      - name: Clean up
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"
